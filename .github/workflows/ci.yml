name: TSEKI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  mobile-and-shared:
    name: Mobile App (Expo) & Shared Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify shared modules are in sync
        run: npm run check:shared
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Expo ESLint
        run: npm run lint
      - name: Run all unit & regression test suites
        run: npm run test:all

  teacher-web:
    name: Teacher Web Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teacher-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: teacher-web/package-lock.json
      - run: npm ci
      - name: Teacher Web production build & TypeScript check
        run: npm run build
      - name: Teacher Web ESLint (advisory for legacy any rules)
        run: npm run lint
        continue-on-error: true

  admin-web:
    name: Admin Web Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - name: Admin Web production build & TypeScript check
        run: npm run build
      - name: Admin Backend Security Tests
        run: npx --yes tsx server/testAdminSecurity.ts
      - name: Admin Web ESLint (advisory)
        run: npm run lint
        continue-on-error: true
